<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>选题与文案工作台</title>
<style>
:root{--bg:#f5f4ef;--paper:#fffefb;--ink:#263a32;--muted:#778079;--line:#e0e3da;--green:#285a45;--soft:#eaf0e7;--gold:#b67d36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.42}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #97bba3;outline-offset:3px}.top{max-width:1500px;margin:auto;padding:24px 32px 18px}.back{color:var(--muted);font-size:13px;text-decoration:none}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--green);margin:22px 0 7px}h1{font-size:30px;letter-spacing:-.04em;margin:0;font-weight:650}p{margin:8px 0}.sub{color:var(--muted)}.counts{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}.counts b{font:500 27px/1.2 Georgia,serif;margin-right:7px}.counts span{font-size:13px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(430px,1fr) minmax(330px,440px);gap:20px;max-width:1500px;padding:10px 32px 42px;margin:auto;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}.tools{padding:18px;border-bottom:1px solid var(--line)}input{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 12px;color:var(--ink)}.filters{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.filter{border:0;background:none;color:var(--muted);padding:7px 11px;border-radius:7px;font-size:13px}.filter.active{color:var(--green);background:var(--soft);font-weight:700}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}th{text-align:left;color:var(--muted);font-size:12px;font-weight:400;padding:13px 14px;border-bottom:1px solid var(--line)}td{padding:16px 14px;border-bottom:1px solid #eeeee7;vertical-align:top}tr:last-child td{border:0}.num{white-space:nowrap;width:43px;color:#929991;font-size:12px}.titlebutton{background:none;border:0;text-align:left;color:var(--ink);padding:0;line-height:1.6;font-weight:600;font-size:14px}.titlebutton:hover{color:var(--green)}.category{display:block;color:var(--muted);font-size:11px;margin-top:4px}.rowactive{background:#f0f4ec}.tags{display:flex;gap:4px;flex-wrap:wrap;width:84px}.tag{font-size:11px;background:#f0f0e9;color:#7b8178;border-radius:4px;padding:2px 6px;white-space:nowrap}.tag.green{color:var(--green);background:#e3eddf}.tag.gold{color:#94622c;background:#f6ecdb}.reader{position:sticky;top:18px}.readerhead{padding:22px 24px;border-bottom:1px solid var(--line)}.kicker{font-size:11px;color:var(--muted);margin:0 0 8px}h2{font-size:21px;line-height:1.6;margin:0}.readerbody{padding:24px;min-height:220px}.script{white-space:pre-wrap;overflow-wrap:anywhere;font:17px/1.95 "Microsoft YaHei",sans-serif;margin:0}.empty{padding:28px 0;color:var(--muted);font-size:14px}.empty strong{display:block;color:#657466;font-weight:500;margin-bottom:8px}.actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 24px 22px}.button{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 12px;border-radius:8px;font-size:13px}.primary{background:var(--green);border-color:var(--green);color:#fff}.selected{background:var(--soft);color:var(--green);border-color:#cadac5}.note{padding:18px 24px;background:#fafaf5;border-top:1px solid var(--line)}label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}textarea{width:100%;min-height:80px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink);font-size:13px}.notefoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}.hint{font-size:11px;color:var(--muted)}.notice{min-height:24px;color:var(--green);font-size:12px;margin:6px 0 0}.notice:empty{display:none}.returnlist{display:none}.error{color:#a44235}.noresult{padding:36px;text-align:center;color:var(--muted)}.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:16px}.dot{width:6px;height:6px;background:#6e9774;border-radius:50%}@media(max-width:940px){.layout{grid-template-columns:1fr;max-width:800px}.reader{position:static}.returnlist{display:inline-block;margin-bottom:12px}.top{max-width:800px}.readerbody{min-height:140px}}@media(max-width:540px){.top{padding:20px 16px 14px}.layout{padding:6px 12px 30px;gap:12px;grid-template-columns:minmax(0,1fr)}h1{font-size:25px}.counts{gap:16px}.counts b{font-size:23px}td{padding:13px 10px}th{padding:11px 10px}.titlebutton{font-size:13px}.readerhead,.readerbody,.note{padding:18px}.actions{padding:0 18px 18px}.tags{width:66px}}
</style>
</head>
<body>
<header class="top"><a class="back" id="back-link" href="/" hidden>返回工作台</a><p class="eyebrow">短视频编导 / 内容工作台</p><h1 id="heading">选题与文案</h1><p class="sub">选一条，看正文，记下决定。后续文案会接着更新在这里。</p><div class="counts" id="counts"></div><div class="status"><span class="dot"></span><span id="connection">正在读取内容…</span><button class="filter" id="refresh">刷新内容</button></div><p id="message" class="notice" role="status" aria-live="polite"></p></header>
<main class="layout"><section class="panel" aria-label="选题表"><div class="tools"><input id="search" type="search" placeholder="搜索选题或分类" aria-label="搜索选题"><div class="filters" id="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="chosen">已选用</button><button class="filter" data-filter="adopted">文案已采纳</button><button class="filter" data-filter="shot">已拍</button></div></div><div class="tablewrap"><table><thead><tr><th class="num">序号</th><th>选题</th><th>进度</th></tr></thead><tbody id="rows"></tbody></table><div id="noresult" class="noresult" hidden>没有匹配的选题</div></div></section><section class="panel reader" id="reader" aria-label="文案阅读与确认"><div class="readerbody empty">点击左边的选题，查看正文和操作。</div></section></main>
<script>
'use strict';
let model=null,active=null,filter='all',query='',busy=false;
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(text,error=false){$('#message').textContent=text;$('#message').classList.toggle('error',error)}
function item(){return model?.items.find(x=>x.id===active)}
function tags(x){return `${x.chosen?'<span class="tag green">已选用</span>':''}${x.adopted?'<span class="tag green">文案已采纳</span>':x.scriptHash?'<span class="tag gold">文案待审</span>':'<span class="tag">待写文案</span>'}${x.shot?'<span class="tag gold">已拍</span>':''}`}
function drawRows(){let rows=model.items.filter(x=>(filter==='all'||x[filter])&&(!query||`${x.title} ${x.category}`.toLowerCase().includes(query.toLowerCase())));$('#rows').innerHTML=rows.map(x=>`<tr class="${active===x.id?'rowactive':''}"><td class="num">${String(x.number).padStart(2,'0')}</td><td><button class="titlebutton" data-open="${esc(x.id)}">${esc(x.title)}</button><span class="category">${esc(x.category)}</span></td><td><div class="tags">${tags(x)}</div></td></tr>`).join('');$('#noresult').hidden=rows.length>0;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}
function drawReader(){const x=item();if(!x)return;$('#reader').innerHTML=`<div class="readerhead"><button class="filter returnlist" data-return="list">↑ 返回选题表</button><p class="kicker">选题 ${String(x.number).padStart(2,'0')} · ${esc(x.category)}</p><h2>${esc(x.title)}</h2></div><div class="readerbody">${x.scriptHash?`<pre class="script">${esc(x.script)}</pre>${x.previouslyAdopted&&!x.adopted?'<p class="hint">正文已有修改，请重新确认当前文案。</p>':''}`:'<div class="empty"><strong>这条文案还没有展开。</strong>目前保留你的原题。选定之后，正文会出现在这里。</div>'}</div><div class="actions"><button class="button ${x.chosen?'selected':''}" data-action="choose">${x.chosen?'✓ 已选用选题':'选用这个选题'}</button><button class="button ${x.adopted?'selected':'primary'}" data-action="adopt" ${!x.scriptHash?'disabled title="有完整文案后即可采纳"':''}>${x.adopted?'✓ 已采纳文案':'采纳文案'}</button><button class="button ${x.shot?'selected':''}" data-action="shot">${x.shot?'✓ 已拍 · 点击取消':'标记已拍'}</button></div><div class="note"><label for="note">给编导的备注</label><textarea id="note" maxlength="4000" placeholder="比如：这条先写，重点讲我的哪段经历…">${esc(x.note)}</textarea><div class="notefoot"><span class="hint">保存后，我能读取你的决定和备注。</span><button class="button" data-action="note">保存备注</button></div></div>`}
function draw(){const back=$('#back-link');back.hidden=!model.return_url;if(model.return_url){back.href=model.return_url;back.textContent='← '+(model.return_label||'返回工作台')}document.title=model.title;$('#heading').textContent=model.title;$('#counts').innerHTML=[['选题',model.items.length],['已选用',model.items.filter(x=>x.chosen).length],['文案已采纳',model.items.filter(x=>x.adopted).length],['已拍',model.items.filter(x=>x.shot).length]].map(([label,count])=>`<div><b>${count}</b><span>${label}</span></div>`).join('');$('#connection').textContent='已连接 · 选择会保存在本机工作记录';drawRows();drawReader()}
async function load(){const response=await fetch('/api/director/state',{cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'暂时无法读取内容');model=data;if(!model.items.some(x=>x.id===active))active=model.items[0]?.id;draw()}
async function act(action){const x=item();if(!x||busy)return;busy=true;document.querySelectorAll('#reader button').forEach(b=>b.disabled=true);const value=action==='note'?$('#note').value:action==='choose'?!x.chosen:action==='shot'?!x.shot:!x.adopted;try{const response=await fetch('/api/director/action',{method:'POST',headers:{'Content-Type':'application/json','X-Workbench':'1'},body:JSON.stringify({id:x.id,action,value,revision:x.revision,scriptHash:x.scriptHash})});const data=await response.json();if(!response.ok)throw Error(data.error||'保存未成功');model=data;draw();message(action==='note'?'备注已保存':action==='adopt'?(value?'已采纳当前版本文案':'已取消采纳'):'状态已保存')}catch(error){message(error.message,true);drawReader()}finally{busy=false}}
document.addEventListener('click',event=>{if(event.target.closest('[data-return]')){document.querySelector('[aria-label=选题表]').scrollIntoView({behavior:'smooth',block:'start'});return}const open=event.target.closest('[data-open]');if(open){active=open.dataset.open;drawRows();drawReader();if(window.innerWidth<=940)$('#reader').scrollIntoView({behavior:'smooth',block:'start'});return}const tab=event.target.closest('[data-filter]');if(tab){filter=tab.dataset.filter;drawRows();return}const button=event.target.closest('[data-action]');if(button)act(button.dataset.action)});
$('#search').addEventListener('input',event=>{query=event.target.value;drawRows()});$('#refresh').addEventListener('click',()=>load().then(()=>message('内容已刷新')).catch(error=>message(error.message,true)));
load().catch(error=>{$('#connection').textContent='连接未完成';message(error.message+'，请通过本机工作台地址打开本页。',true)});
</script>
</body></html>
