<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{brand}} 海报</title>
<!-- Original layouts adapted for Chinese commercial posters from Open Design editorial template principles and poster-generator-skill style references. See bundled licenses. -->
<style>
@font-face{font-family:HanSans;src:url('assets/fonts/SourceHanSansCN-Regular.otf')}@font-face{font-family:HanSerif;src:url('assets/fonts/SourceHanSerifCN-Regular.ttf')}
*{box-sizing:border-box}body{margin:0;background:#e8e8e8;font-family:HanSans,sans-serif;color:#282a26}.toolbar{padding:14px;position:sticky;top:0;background:#fff;z-index:10;text-align:center;font:15px/1.6 HanSans,sans-serif}.toolbar button{font:inherit;margin:0 5px;padding:8px 14px;cursor:pointer;border:1px solid #bbb;background:white}.toolbar small{display:inline-block;margin:0 8px;color:#555}.stage{width:1200px;margin:28px auto}.poster{width:1200px;height:1800px;position:relative;overflow:hidden;background:#f5f1e8;padding:64px 70px 55px;display:flex;flex-direction:column;--accent:#df722e;--ink:#282a26;--muted:#6e7068;--rule:#c8c8bc}.masthead{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--ink);padding-top:20px;font-size:29px;color:var(--muted);min-height:60px}.masthead span:last-child{text-align:right}.title{font:148px/1.24 HanSerif,serif;margin:38px 0 0;letter-spacing:8px;font-weight:400}.strap{font-size:46px;line-height:1.5;margin:16px 0 0;letter-spacing:2px}.hero{margin:32px 0 38px;min-height:485px;display:grid;grid-template-columns:1.25fr 1fr;gap:40px}.hero-message{font:69px/1.5 HanSerif,serif;align-self:center;letter-spacing:0}.intro{font:31px/1.8 HanSans,sans-serif;color:var(--muted);display:block;margin-top:22px;letter-spacing:1px}.portrait{width:100%;height:485px;object-fit:cover;object-position:center 22%;display:block}.features{display:grid;grid-template-columns:1fr 1fr;gap:24px 46px}.module{padding:19px 0 0;border-top:1px solid var(--rule);min-height:118px}.module-head{display:flex;align-items:baseline;gap:17px}.num{font:25px/1.4 HanSerif,serif;color:var(--accent)}.module h3{font:43px/1.5 HanSans,sans-serif;font-weight:500;margin:0}.module p{font:32px/1.65 HanSans,sans-serif;color:var(--muted);margin:5px 0 0 50px}.delivery{font-size:34px;line-height:1.7;border-top:2px solid var(--ink);padding-top:24px;margin-top:36px;letter-spacing:1px}.bottom{margin-top:auto;padding-top:26px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:25px}.cta{font:46px/1.4 HanSerif,serif;color:var(--accent)}.mini-brand{font:30px/1.5 HanSans,sans-serif;color:var(--muted)}.disclaimer{font:23px/1.5 HanSans,sans-serif;color:var(--muted);padding-top:18px}.sample-marker{position:absolute;top:4px;right:12px;font-size:15px;color:#6a655d}
.commercial{background:#ff9400;--accent:#ff9400;--ink:#24211d;--rule:#dfdbd2;--muted:#57544f}.commercial .masthead{color:#24211d;border-top:0}.commercial .title{font:165px/1.1 HanSans,sans-serif;font-weight:900;letter-spacing:-4px;margin-top:28px}.commercial .strap{font-size:56px;font-weight:700;margin-top:24px}.commercial .hero{background:#24211d;color:#fff7ec;min-height:345px;grid-template-columns:1.8fr 1fr;gap:15px;padding:30px 35px;margin-top:34px;margin-bottom:0}.commercial .hero-message{font:66px/1.35 HanSans,sans-serif;font-weight:500}.commercial .intro{color:#cbc7bf;font-size:31px;margin-top:15px}.commercial .portrait{height:290px;object-fit:cover}.commercial .features{background:#fff7ec;padding:30px 35px;gap:17px 38px}.commercial .module{min-height:133px;padding-top:16px}.commercial .module h3{font-weight:700;font-size:42px}.commercial .module p{font-size:31px}.commercial .num{font-size:28px;color:#a4551d}.commercial .delivery{background:#24211d;color:#fff7ec;margin-top:0;padding:22px 34px;font-size:31px;border:0}.commercial .bottom{border-color:#24211d}.commercial .cta{color:#24211d;font-family:HanSans;font-weight:700;font-size:54px}.commercial .mini-brand{color:#24211d}.commercial .disclaimer{color:#3f382a}
.bold{background:#242520;color:#f4f1e6;--accent:#ff9400;--ink:#f4f1e6;--rule:#616158;--muted:#cccdbf}.bold .masthead{border-top:2px solid #ff9400;color:#dddccf}.bold .title{font:89px/1.2 HanSans,sans-serif;font-weight:700;margin-top:32px;letter-spacing:-1px}.bold .strap{font:137px/1.35 HanSans,sans-serif;font-weight:900;margin:18px 0 20px;color:#ff9400;letter-spacing:-4px;max-width:1000px;white-space:pre-line}.bold .hero{display:block;min-height:0;margin:0 0 40px;border-top:2px solid #ff9400;padding-top:24px}.bold .hero-message{font:43px/1.5 HanSans,sans-serif;letter-spacing:0}.bold .intro{font-size:29px;color:#cccdbf;margin-top:10px}.bold .portrait{display:none}.bold .features{gap:22px 55px}.bold .module h3{font-size:43px;font-weight:600}.bold .module p{font-size:32px}.bold .num{color:#ff9400}.bold .delivery{border-color:#ff9400;font-size:33px;margin-top:34px}.bold .bottom{border:0;padding-top:25px}.bold .cta{font:52px/1.3 HanSans,sans-serif;color:#ff9400;font-weight:700}.bold .mini-brand{color:#dddccf}.bold .disclaimer{padding-top:4px}
.countdown{background:#232722;color:#f5f1e8;--accent:#ff9400;--ink:#f5f1e8;--muted:#cbcdc1;--rule:#62675d}.countdown .title{font:65px/1.3 HanSans,sans-serif;letter-spacing:0;margin-top:50px}.countdown .remaining-label{font:46px/1.6 HanSans,sans-serif;color:#cbcdc1;margin-top:70px}.countdown .time{display:flex;align-items:baseline;gap:35px;border-bottom:2px solid #ff9400;padding-bottom:30px;margin-top:0}.countdown .time strong{font:650px/.98 HanSerif,serif;font-weight:400;color:#ff9400;letter-spacing:-35px}.countdown .time span{font:92px/1 HanSans,sans-serif}.countdown .event-name{font:74px/1.5 HanSerif,serif;margin:45px 0 30px;max-width:1010px}.countdown .deadline-text{font:34px/1.8 HanSans,sans-serif;color:#cbcdc1}.countdown .bottom{border-color:#62675d}.countdown .cta{color:#ff9400;font-family:HanSans;font-size:46px}.countdown .mini-brand{color:#cbcdc1}.countdown .disclaimer{color:#cbcdc1}.countdown .sample-marker{color:#cbcdc1}
.case .title{font:80px/1.45 HanSerif,serif;letter-spacing:0;margin-top:48px}.case .case-deck{font:35px/1.8 HanSans,sans-serif;color:var(--muted);margin:20px 0 38px}.case .comparison{display:grid;grid-template-columns:1fr 1fr;gap:35px}.case .proof-card{border-top:2px solid var(--ink);padding-top:20px}.case .proof-title{font:37px/1.6 HanSans,sans-serif;font-weight:700;min-height:62px}.case .proof-image{width:100%;height:545px;object-fit:contain;background:#e7e3d8;padding:12px;display:block;margin-top:18px}.case .proof-caption{font:29px/1.6 HanSans,sans-serif;color:var(--muted);margin-top:18px;min-height:92px}.case .process{margin-top:36px;padding:24px 0;border-top:1px solid var(--rule);font:35px/1.8 HanSans,sans-serif}.case .evidence{font:28px/1.75 HanSans,sans-serif;color:var(--muted);margin-top:22px}.case .delivery{font-size:31px;margin-top:30px}.case .cta{font-size:41px}.case .bottom{padding-top:16px}
body.editing [data-copy]{outline:2px dashed #789680;cursor:text}body.editing [data-copy]:focus{outline:3px solid #376148;background:#ffffff16}
#poster>*{flex-shrink:0}
.editorial .title{line-height:1.45}
.commercial .title{line-height:1.35}
.bold .strap{font-size:117px;line-height:1.20;white-space:normal}
.bold .strap span{display:block}
.bold .strap span:nth-child(2){text-align:right;padding-right:45px}
.bold .hero{min-height:195px}
.bold .hero-message{line-height:1.3}
.bold .hero .intro{margin-top:8px}
.countdown .time{margin-top:25px}
.countdown .time strong{font-family:HanSans,sans-serif;line-height:1.55;font-size:520px;letter-spacing:0}
.countdown .remaining-label{margin-top:55px}
.countdown .event-name{margin-top:28px;font-size:68px}
@media print{body{background:transparent}.toolbar{display:none}.stage{margin:0}.poster{break-after:page}}
</style></head><body><div class="toolbar"><button id="edit">编辑文字</button><button id="save">保存可编辑HTML</button><small>{{status}}</small></div><div class="stage"><main id="poster" class="poster {{style}}">{{body}}</main></div>
<script>
document.querySelector('#edit').onclick=()=>{const yes=document.body.classList.toggle('editing');document.querySelectorAll('[data-copy]').forEach(e=>e.contentEditable=String(yes));document.querySelector('#edit').textContent=yes?'结束编辑':'编辑文字'};
document.querySelector('#save').onclick=()=>{document.querySelectorAll('[data-copy]').forEach(e=>e.removeAttribute('contenteditable'));document.body.classList.remove('editing');document.querySelector('#edit').textContent='编辑文字';const blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='poster-edited.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
