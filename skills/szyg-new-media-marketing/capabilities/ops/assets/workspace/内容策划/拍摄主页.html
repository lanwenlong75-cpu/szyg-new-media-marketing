<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选题与拍摄</title><style>body{font:16px/1.9 system-ui;color:#233c2b;background:#f4f7f0;max-width:860px;margin:40px auto;padding:0 24px}article{background:white;border:1px solid #dae4d2;border-radius:12px;padding:24px;margin:20px 0}pre{white-space:pre-wrap;font:inherit}button{padding:8px 16px;border:0;border-radius:6px;background:#245e43;color:white;cursor:pointer}</style><h1>选题与拍摄</h1><p>在运营工作台选择本次要拍的内容，交给AI助手准备口播、分镜和提词。</p><div id="list"></div><script src="选题库.js"></script><script>let topics=window.SHOOTING_TOPICS?.items||[],box=document.querySelector('#list');if(!topics.length)box.textContent='还没有选题。给助手一个主题或业务目标，它会把选题写回工作区。';for(const t of topics){let card=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),text=document.createElement('pre'),b=document.createElement('button');h.textContent=`${t.number||''} ${t.label||t.title||''}`;p.textContent=t.scene||'';text.textContent=t.prompt||'';b.textContent='复制完整提示词';b.onclick=async()=>{await navigator.clipboard.writeText(t.prompt||'');b.textContent='已复制'};card.append(h,p,text,b);box.append(card)}</script></html>
