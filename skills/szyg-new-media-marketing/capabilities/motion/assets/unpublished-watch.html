<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未发布视频 · 快捷观看</title>
<style>
:root{--ink:#182c40;--muted:#64758a;--line:#dce4ec;--blue:#235db1;--soft:#f2f5f8}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1450px;margin:auto;padding:24px}h1{font-size:29px;margin:0}h2{font-size:23px;margin:0}p{margin:6px 0}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button,input,select,textarea{font:inherit}button,.button{display:inline-flex;justify-content:center;align-items:center;gap:5px;border:1px solid var(--line);background:white;color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none}button:hover{border-color:#6d98c9}button:disabled{opacity:.4;cursor:default}.primary{background:var(--blue);color:white;border-color:var(--blue)}header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}.muted{color:var(--muted)}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}.box{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.find{padding:16px;border-bottom:1px solid var(--line)}.find input{width:100%;padding:10px 12px;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;margin-top:8px}.filter{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.filter button{font-size:12px;padding:5px 9px}.filter .active{color:white;background:var(--ink)}#list{max-height:calc(100vh - 270px);min-height:280px;overflow:auto}.item{display:flex;width:100%;gap:12px;padding:14px;border:0;border-bottom:1px solid #edf1f5;border-radius:0;text-align:left;justify-content:flex-start;background:white}.item.active{background:#eaf2fc;border-left:4px solid var(--blue);padding-left:10px}.item img{width:69px;height:92px;object-fit:cover;background:#e6ebf1;border-radius:6px;flex:none}.item strong{font-size:14px;display:block;font-weight:600}.item .label{display:block;font-size:12px;color:var(--muted);margin-top:4px}.item small{font-size:11px;color:#476482}.player-title{padding:18px 20px 12px}.badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:5px;background:#edf2f7;margin:4px 6px 4px 0}.pending{background:#fff0d7;color:#875309}.stage{background:#e1e8ef;display:flex;align-items:center;justify-content:center;min-height:200px;position:relative;padding:12px}video{display:block;max-width:100%;max-height:min(60vh,620px);width:auto;background:#101b26;border-radius:5px}.video-info{padding:11px 20px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);overflow-wrap:anywhere}.playbar{padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.playbar select{border:1px solid var(--line);padding:7px;border-radius:6px}.context{padding:0 20px 17px}.context .note{background:#fff5e6;color:#765324;font-size:13px;padding:10px 12px;border-radius:7px;margin:7px 0}.revise{padding:18px 20px;border-top:1px solid var(--line);background:#fcfdff}.revise h3{font-size:17px;margin:0 0 6px}.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.range input{width:95px;border:1px solid var(--line);border-radius:6px;padding:7px}.range button{font-size:12px;padding:7px 10px}.revise textarea{display:block;width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px}.request-actions{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}#request-status{font-size:12px;color:#206348}#draft-output{width:100%;min-height:145px;white-space:pre-wrap;margin-top:12px;color:#294561;background:#f1f6fc}#error{background:#fff1e9;color:#934125;padding:12px 20px}footer{font-size:12px;color:var(--muted);margin-top:15px}.empty{padding:25px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:950px){main{padding:15px}.layout{grid-template-columns:1fr}.library{order:2}.viewer{order:1}#list{max-height:430px;min-height:0}.find{padding:12px}.item img{width:55px;height:73px}header{display:block}.actions{margin-top:10px}h1{font-size:25px}h2{font-size:20px}.player-title,.playbar,.context,.revise{padding-left:15px;padding-right:15px}video{max-height:52vh}.stage{padding:8px}.small{font-size:12px}}
</style></head><body><main>
<header><div><h1>未发布视频 · 快捷观看</h1><p id="summary" class="muted"></p><p class="small muted" id="fresh"></p></div><div class="actions"><a class="button" href="../00-视频库入口.html">视频库首页</a><a class="button" href="index.html">发布总表</a><button id="choose-video" class="primary">选择视频</button></div></header>
<div class="layout"><aside class="box library" id="library"><div class="find"><b>点标题，直接观看</b><input id="search" aria-label="搜索未发布视频" placeholder="搜索编号、主题或文件名"><div class="filter" id="filters"><button data-filter="all" class="active">全部未发布</button><button data-filter="delivered">已有成片</button><button data-filter="review">待确认审阅版</button><button data-filter="raw">原片</button></div></div><div id="list"></div></aside>
<section class="box viewer"><div class="player-title"><h2 id="title"></h2><div id="badges"></div></div><div class="stage"><video id="player" controls playsinline preload="metadata"></video></div><div id="error" role="status" hidden>这份视频暂时无法在当前浏览器播放，请打开下方校对页，或下载该视频后观看。</div><div class="video-info" id="version"></div><div class="playbar"><button id="previous">上一条</button><button id="next">下一条</button><button id="back">后退10秒</button><button id="forward">前进10秒</button><label>倍速 <select id="speed" aria-label="播放倍速"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><span id="clock" class="small muted">00:00 / 00:00</span></div><div class="context"><div class="actions" id="links"></div><div id="notes"></div></div>
<section class="revise"><h3>这条需要怎么改</h3><p class="small muted">也可以直接在聊天里说：编号 + 时间 + 修改要求。例如“V-007，00:40到00:48删掉重复的话”。</p><div class="range"><label>从 <input id="start" aria-label="修改起点" placeholder="00:00"></label><button id="mark-start">记当前起点</button><label>到 <input id="end" aria-label="修改终点" placeholder="可不填"></label><button id="mark-end">记当前终点</button></div><textarea id="request" aria-label="修改要求" placeholder="例如：这段字幕改成……；删掉重复起句；产品图停留再久一点。"></textarea><div class="request-actions"><button class="primary" id="copy-request">复制修改要求</button><button id="save-request">下载修改要求</button><span id="request-status" role="status"></span></div><textarea id="draft-output" aria-label="可复制的修改要求" readonly hidden></textarea></section></section></div>
<div id="none" class="box empty" hidden>当前没有符合“未发布”的内容。</div><footer>修改要求会带上固定编号、当前视频文件和时间，方便助手找到对应工程。观看页面里的草稿保存在本浏览器；复制到聊天或下载后，才能作为正式修改要求交给助手。不会自动修改视频或发起发布。</footer>
</main><script>
const D=/*__WATCH_DATA__*/;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pathURL(p){if(!p)return '';if(/^https?:/.test(p))return p;if(/^[A-Za-z]:[\\/]/.test(p))return 'file:///'+p.replaceAll('\\','/').split('/').map(encodeURIComponent).join('/').replace('%3A',':');return '../'+p.split('/').map(encodeURIComponent).join('/');}
function fmt(s){s=Math.max(0,Number(s)||0);const mins=Math.floor(s/60),sec=Math.floor(s%60);return String(mins).padStart(2,'0')+':'+String(sec).padStart(2,'0');}
function date(s){return s?String(s).replace('T',' ').replace(/\+08:00$/,''):'';}
let current=null,filter='all',visible=[];
const player=$('#player');
$('#summary').textContent=`${D.videos.length}条未发布视频：${D.videos.filter(v=>v.watchKind==='成片').length}条成片/审阅版，${D.videos.filter(v=>v.watchKind==='原片').length}条原片。`;
$('#fresh').textContent='发布记录核对：'+date(D.publicationCheckedAt)+'（北京时间）';
function storageKey(v){return 'video-revision-draft/1/'+v.id+'/'+v.watchFile;}
function saveDraft(){if(!current)return;try{localStorage.setItem(storageKey(current),JSON.stringify({start:$('#start').value,end:$('#end').value,request:$('#request').value}));}catch{}}
function draftText(){if(!current)return '';return [`请修改这条未发布视频：${current.id}｜${current.title}`,`我看的版本：${current.watchFile?.split('/').pop()||'暂无可播放文件'}`,`视频位置：${D.root.replaceAll('\\','/')}/${current.watchFile||''}`,`修改时间：${$('#start').value||fmt(player.currentTime)}${$('#end').value?' 到 '+$('#end').value:''}`,`修改要求：${$('#request').value.trim()}`,`工程：${(current.projectDirs||[]).map(p=>D.root.replaceAll('\\','/')+'/'+p).join('；')||'请根据内容编号查找对应交付和审稿记录'}`,'请另存新版本，更新对应成片、字幕和观看入口。'].join('\n');}
function renderList(){const q=$('#search').value.toLowerCase();visible=D.videos.filter(v=>(!q||[v.id,v.title,v.watchFile,v.series].join(' ').toLowerCase().includes(q))&&(filter==='all'||filter==='raw'&&v.watchKind==='原片'||filter==='review'&&v.productionStatus==='审阅版待确认'||filter==='delivered'&&v.watchKind==='成片'&&v.productionStatus!=='审阅版待确认'));$('#list').innerHTML=visible.map(v=>`<button class="item ${current?.id===v.id?'active':''}" data-id="${esc(v.id)}" aria-label="观看 ${esc(v.id)} ${esc(v.title)}">${v.watchPoster?`<img src="${esc(pathURL(v.watchPoster))}" alt="" loading="lazy">`:''}<span><small>${esc(v.id)} · ${esc(v.productionStatus)}</small><strong>${esc(v.title)}</strong><span class="label">${fmt(v.duration)} · ${esc(v.watchKind)} · 未发布</span></span></button>`).join('')||'<p class="empty">没有匹配的视频</p>';}
function select(id,autoplay=false){const v=D.videos.find(v=>v.id===id);if(!v)return;saveDraft();player.pause();current=v;$('#title').textContent=v.id+' · '+v.title;$('#badges').innerHTML=`<span class="badge">未发布</span><span class="badge ${v.productionStatus.includes('确认')||v.watchKind==='原片'?'pending':''}">${esc(v.productionStatus)}</span><span class="badge">${esc(v.series)}</span>`;$('#version').textContent='当前观看：'+v.watchKind+' · '+(v.watchFile?.split('/').pop()||'没有找到可播放文件');$('#error').hidden=true;player.poster=v.watchPoster?pathURL(v.watchPoster):'';if(v.watchFile){player.src=pathURL(v.watchFile);player.load();}else{player.removeAttribute('src');player.load();$('#error').hidden=false;}player.playbackRate=Number($('#speed').value);$('#clock').textContent='00:00 / '+fmt(v.duration);$('#links').innerHTML=(v.preview&&location.protocol==='file:'?`<a class="button" href="${esc(pathURL(v.preview))}" target="_blank" rel="noopener">逐句校对 / 修改字幕</a>`:'')+(v.watchFile?`<a class="button" href="${esc(pathURL(v.watchFile))}" download>下载当前视频</a>`:'');$('#notes').innerHTML=v.notes?`<p class="note">${esc(v.notes)}</p>`:'';if(v.watchKind==='原片')$('#notes').insertAdjacentHTML('beforeend','<p class="note">这条先看原片，尚未找到明确对应的剪辑交付。确认要保留的内容后，可以直接说编号让我剪辑。</p>');$('#start').value='';$('#end').value='';$('#request').value='';$('#request-status').textContent='';$('#draft-output').hidden=true;try{const saved=JSON.parse(localStorage.getItem(storageKey(v))||'null');if(saved){$('#start').value=saved.start||'';$('#end').value=saved.end||'';$('#request').value=saved.request||'';}}catch{}$('#previous').disabled=D.videos.indexOf(v)<=0;$('#next').disabled=D.videos.indexOf(v)>=D.videos.length-1;try{const u=new URL(location.href);u.searchParams.set('video',v.id);history.replaceState(null,'',u);}catch{}renderList();if(autoplay)player.play().catch(()=>{});}
function jump(delta){if(!current)return;const index=D.videos.findIndex(v=>v.id===current.id)+delta;if(D.videos[index])select(D.videos[index].id);}
$('#list').onclick=e=>{const button=e.target.closest('[data-id]');if(button){select(button.dataset.id);if(innerWidth<=950)document.querySelector('.viewer').scrollIntoView({behavior:'smooth',block:'start'});}};
$('#filters').onclick=e=>{if(!e.target.dataset.filter)return;filter=e.target.dataset.filter;$('#filters').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===e.target));renderList();};
$('#search').oninput=renderList;$('#previous').onclick=()=>jump(-1);$('#next').onclick=()=>jump(1);$('#choose-video').onclick=()=>$('#library').scrollIntoView({behavior:'smooth',block:'start'});$('#back').onclick=()=>{player.currentTime=Math.max(0,player.currentTime-10)};$('#forward').onclick=()=>{player.currentTime=Math.min(Number.isFinite(player.duration)?player.duration:current?.duration||0,player.currentTime+10)};$('#speed').onchange=()=>{player.playbackRate=Number($('#speed').value)};
$('#mark-start').onclick=()=>{$('#start').value=fmt(player.currentTime);saveDraft()};$('#mark-end').onclick=()=>{$('#end').value=fmt(player.currentTime);saveDraft()};['start','end','request'].forEach(id=>$('#'+id).addEventListener('input',saveDraft));
player.addEventListener('timeupdate',()=>{$('#clock').textContent=fmt(player.currentTime)+' / '+fmt(player.duration||current?.duration)});player.addEventListener('error',()=>{$('#error').hidden=false});
$('#copy-request').onclick=async()=>{if(!$('#request').value.trim()){$('#request-status').textContent='先写下要改什么。';$('#request').focus();return;}const text=draftText();$('#draft-output').value=text;try{await navigator.clipboard.writeText(text);$('#request-status').textContent='已复制，粘贴到聊天即可。';}catch{$('#draft-output').hidden=false;$('#draft-output').select();$('#request-status').textContent='请复制下方文字，粘贴到聊天。';}saveDraft();};
$('#save-request').onclick=()=>{if(!$('#request').value.trim()){$('#request-status').textContent='先写下要改什么。';return;}const text=draftText(),url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=current.id+'_修改要求.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);$('#request-status').textContent='已下载修改要求。';};
window.addEventListener('beforeunload',saveDraft);
if(D.videos.length){select(new URL(location.href).searchParams.get('video')||D.videos[0].id);if(!current)select(D.videos[0].id);}else{$('.layout').hidden=true;$('#none').hidden=false;}
</script></body></html>
