<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频内容与发布台账</title>
<style>
:root{--ink:#192b3d;--muted:#617185;--line:#dfe6ed;--accent:#235db1;--green:#166849;--amber:#945709}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:var(--ink);font:15px/1.55 "Microsoft YaHei",sans-serif}main{max-width:1560px;margin:auto;padding:32px 28px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}h1{font-size:30px;margin:0 0 8px}p{margin:6px 0}.muted{color:var(--muted)}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.actions{display:flex;gap:10px;flex-wrap:wrap}button,.button{font:inherit;border:1px solid var(--line);border-radius:8px;background:white;padding:9px 15px;cursor:pointer;color:var(--ink)}button.active,.primary{background:var(--ink);color:white;border-color:var(--ink)}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:26px 0}.metric{padding:16px 20px;border:1px solid var(--line);border-radius:12px;background:white}.metric strong{display:block;font-size:29px}.metric span{color:var(--muted);font-size:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px;background:white}input{min-width:280px;flex:1;max-width:450px}.notice{padding:12px 16px;background:#fff5e4;border:1px solid #ebd6af;border-radius:8px;margin:15px 0}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.scroll{overflow:auto;max-height:68vh}table{border-collapse:collapse;width:100%;min-width:1120px}thead{position:sticky;top:0;z-index:1;background:#eaf0f5}th{text-align:left;font-size:13px;color:#405165;padding:13px 14px;white-space:nowrap}td{padding:15px 14px;border-top:1px solid #edf1f4;vertical-align:top}tbody tr:hover{background:#f7faff}td.topic{min-width:255px;max-width:310px}td.topic b{font-size:16px;display:block}.sub{font-size:12px;color:var(--muted);display:block;margin-top:4px}.tag{font-size:12px;border-radius:5px;display:inline-block;padding:3px 7px;background:#eef2f6;white-space:nowrap}.ok{background:#e4f3ea;color:var(--green)}.wait{background:#fff1d8;color:var(--amber)}.fail{background:#fde8e7;color:#a03128}.links{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;margin-top:6px}.state{min-width:115px}.note{max-width:380px;min-width:230px;font-size:13px}.foot{padding:14px 18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}.empty{text-align:center;padding:40px}.details{padding:0 18px 18px;background:#f6f9fc}.details h3{font-size:16px;margin-bottom:6px}.details table{min-width:800px}.details td{padding:10px 12px}details{max-width:300px}summary{cursor:pointer;color:var(--accent);font-size:13px}#legend{margin:12px 0;color:var(--muted);font-size:13px}.path{font-size:12px;word-break:break-all}footer{margin-top:18px;font-size:13px;color:var(--muted)}@media(max-width:850px){main{padding:20px 12px}header{display:block}.actions{margin-top:14px}.metrics{grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:12px}.metric strong{font-size:25px}h1{font-size:25px}input{min-width:200px}.scroll{max-height:70vh}}
</style></head><body><main>
<header><div><h1>视频内容与发布台账</h1><p class="muted">每条内容一行，原片、工程、成片版本和各平台发布记录放在一起。</p><p id="fresh" class="sub"></p></div><div class="actions"><a class="button primary" id="watch-link" href="未发布观看.html">快速观看未发布视频</a><a class="button" href="../00-视频库入口.html">视频库首页</a><a class="button" href="视频发布台账.xlsx" download>下载 Excel</a><a class="button" href="视频总表.csv" download>下载 CSV</a></div></header>
<div id="metrics" class="metrics"></div><div id="alerts"></div>
<div class="tabs" id="tabs"><button class="active" data-view="all">全部视频</button><button data-view="published">已发布</button><button data-view="scheduled">定时与到点核验</button><button data-view="unpublished">未发布</button><button data-view="attention">待处理</button><button data-view="history">发布记录</button><button data-view="files">视频文件清单</button></div>
<div class="tools"><input id="search" placeholder="搜索标题、文件名、系列或编号" aria-label="搜索"><select id="series" aria-label="系列"><option value="">全部系列</option></select><select id="platform" aria-label="平台"><option value="">全部平台</option><option>抖音</option><option>小红书</option><option>视频号</option></select><span id="matched" class="muted"></span></div>
<p id="legend">“未发布”依据完整蚁小二查询及用户确认的发布范围。审阅版和待剪原片分别显示剪辑状态。定时到点后须回读成功结果，才计为已发布。</p>
<section class="panel"><div class="scroll"><table id="table"></table></div><div class="foot" id="foot"></div></section>
<footer>双击“刷新发布台账.cmd”可查询最新结果并更新此表。修改 Excel 后，请把修改交给助手回填台账，保留补充内容后再刷新。</footer>
</main><script>
const D=/*__LEDGER_DATA__*/;
let view='all';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(D.watchUrl)$('#watch-link').href=D.watchUrl;
const dt=s=>s?String(s).replace('T',' ').replace(/\.\d+/,'').replace(/\+08:00$/,''):'';
const href=p=>p?(String(p).startsWith('http')?p:'../'+String(p).split('/').map(encodeURIComponent).join('/')):null;
const link=(p,label)=>p?`<a href="${esc(href(p))}" target="_blank" rel="noopener">${esc(label)}</a>`:'';
const tag=s=>`<span class="tag ${s.startsWith('已发布')||s==='三平台已发布'||s==='部分平台已发布'?'ok':/定时|核验|审核|确认/.test(s)?'wait':/失败|缺失|冲突/.test(s)?'fail':''}">${esc(s)}</span>`;
const seconds=s=>s==null?'—':s>=60?`${Math.floor(s/60)}分${(s%60).toFixed(1)}秒`:`${s.toFixed(1)}秒`;
$('#fresh').textContent=`文件梳理：${dt(D.generatedAt)}　发布回读：${dt(D.publicationCheckedAt)||'尚未查询'}（北京时间）`;
$('#metrics').innerHTML=[['contents','条内容'],['published','条已发过（含部分平台）'],['scheduled','条定时发布'],['unpublished','条未发布'],['due','条到点待核验'],['missingSources','条原片缺失']].map(([k,t])=>`<div class="metric"><strong>${D.summary[k]}</strong><span>${t}</span></div>`).join('');
const alerts=[];if(!D.publicationComplete)alerts.push('本次发布查询未覆盖全部记录，缺回执的内容暂保留为“未查到发布记录”。');
if(D.summary.due)alerts.push('有定时视频已到发布时间，尚未取得正式发布成功回执。');
if(D.events.some(e=>e.status.includes('冲突')))alerts.push('女装店抖音：历史记录含用户已发布确认，本轮详情仍显示审核中，需核对作品公开状态。');
if(D.summary.unassignedTasks)alerts.push(`${D.summary.unassignedTasks} 条发布任务尚未关联视频主题，请补充归属。`);
$('#alerts').innerHTML=alerts.map(t=>`<p class="notice">${esc(t)}</p>`).join('');
for(const s of [...new Set(D.videos.map(v=>v.series||'待定主题'))])$('#series').insertAdjacentHTML('beforeend',`<option>${esc(s)}</option>`);
function platformCell(e){return tag(e.status)+(e.plannedAt?`<span class="sub">安排 ${dt(e.plannedAt)}</span>`:'')+(e.url?`<span class="sub">${link(e.url,'查看作品')}</span>`:'');}
function detail(v){const events=D.events.filter(e=>e.videoId===v.id);return `<details><summary>路径与发布证据</summary><div class="path">${(v.sources||[]).map(p=>`${link(p,p)}${v.missingSources.includes(p)?'（缺失）':''}`).join('<br>')}</div><div class="path">${(v.projectDirs||[]).map(p=>link(p,'工程：'+p)).join('<br>')}</div>${events.map(e=>`<p class="path">${esc(e.platform)} ${tag(e.status)}<br>提交 ${dt(e.submittedAt)||'未提供'}<br>${e.plannedAt?'定时 '+dt(e.plannedAt)+'<br>':''}${link(e.file,'当次提交视频')} ${link(e.source,'回读证据')}<br>${esc(e.error||e.notes)}</p>`).join('')}</details>`;}
function render(){const q=$('#search').value.toLowerCase(),series=$('#series').value,p=$('#platform').value;let rows=[];let head=[];
if(view==='files'){rows=D.files.filter(f=>(!q||JSON.stringify(f).toLowerCase().includes(q))&&(!series||f.videoIds.some(id=>D.videos.some(v=>v.id===id&&v.series===series))));head=['文件','角色','关联内容','大小（MB）','路径'];$('#table').innerHTML=`<thead><tr>${head.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${rows.map(f=>`<tr><td>${link(f.path,f.name)}</td><td>${esc(f.role)}</td><td>${f.videoIds.map(id=>esc(D.videos.find(v=>v.id===id)?.title||id)).join('<br>')||'辅助/待关联'}</td><td>${(f.size/1048576).toFixed(1)}</td><td class="path">${esc(f.path)}</td></tr>`).join('')}</tbody>`;}
else if(view==='history'){rows=D.events.filter(e=>(!q||JSON.stringify(e).toLowerCase().includes(q))&&(!p||e.platform===p)&&(!series||D.videos.some(v=>v.id===e.videoId&&v.series===series))).sort((a,b)=>(b.submittedAt||'').localeCompare(a.submittedAt||''));head=['视频','平台 / 账号','状态','提交时间','定时安排','提交版本','结果与证据'];$('#table').innerHTML=`<thead><tr>${head.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${rows.map(e=>`<tr><td class="topic"><b>${esc(D.videos.find(v=>v.id===e.videoId)?.title||e.title)}</b><span class="sub">${esc(e.title)}</span></td><td>${esc(e.platform)}<span class="sub">${esc(e.account)}</span></td><td>${tag(e.status)}</td><td>${dt(e.submittedAt)||'未提供'}</td><td>${dt(e.plannedAt)||'即时发布'}</td><td class="path">${link(e.file,e.file?.split('/').pop()||'')}<span class="sub">${esc(e.taskSetId)}</span></td><td class="note">${esc(e.error||e.notes)}<div class="links">${link(e.source,'回执')}${link(e.url,'作品')}</div></td></tr>`).join('')}</tbody>`;}
else{rows=D.videos.filter(v=>(!q||JSON.stringify(v).toLowerCase().includes(q))&&(!series||v.series===series)&&(!p||view==='all'||(view==='published'?v.platforms[p]?.status.startsWith('已发布'):view==='scheduled'?/定时|核验/.test(v.platforms[p]?.status):view==='unpublished'?v.platforms[p]?.status==='未发布':true))&& (view==='all'||view==='published'&&v.publishStatus.includes('已发布')||view==='scheduled'&&/定时|核验/.test(v.publishStatus)||view==='unpublished'&&v.publishStatus==='未发布'||view==='attention'&&(v.missingSources.length||/失败|核验|确认|审核/.test(v.publishStatus+v.productionStatus+v.notes)||Object.values(v.platforms).some(e=>/失败|冲突/.test(e.status)))));
head=['视频主题','剪辑 / 原片','发布总状态',...['抖音','小红书','视频号'],'时长 / 版本','查看与备注'];$('#table').innerHTML=`<thead><tr>${head.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${rows.map(v=>`<tr data-id="${esc(v.id)}"><td class="topic"><b>${esc(v.title)}</b><span class="sub">${esc(v.id)}　${esc(v.series)}</span></td><td class="state">${tag(v.productionStatus||'待确认')}<span class="sub">${tag(v.sourceStatus)}</span></td><td class="state">${tag(v.publishStatus)}</td>${['抖音','小红书','视频号'].map(p=>`<td class="state">${platformCell(v.platforms[p])}</td>`).join('')}<td>${seconds(v.duration)}<span class="sub">${v.width&&v.height?v.width+'×'+v.height:''}</span><span class="sub">${v.versionCount} 个成片 / 母版版本</span></td><td class="note"><div class="links">${link(v.primaryVideo,'当前成片')}${link(v.preview,'校对页')}</div><span class="sub">${esc(v.notes||'')}</span>${detail(v)}</td></tr>`).join('')}</tbody>`;}
$('#matched').textContent=`${rows.length} ${view==='files'?'个文件':view==='history'?'条记录':'条内容'}`;if(!rows.length)$('#table').insertAdjacentHTML('beforeend',`<tbody><tr><td colspan="10" class="empty">没有符合条件的记录</td></tr></tbody>`);
$('#foot').textContent=view==='files'?`${D.files.length} 个视频文件含母版、历史版本、复核片段和可复用素材，不等于内容条数。工具依赖、Skill演示和整理备份不计入。`:view==='history'?'保留失败与重试记录。任务提交成功、已上传和审核中均不自动计为正式发布。':'同一条内容的版本归在一起。未发布状态不表示成片已经定稿，先查看剪辑状态与待确认事项。';}
$('#tabs').onclick=e=>{if(!e.target.dataset.view)return;view=e.target.dataset.view;$('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===e.target));render()};['search','series','platform'].forEach(id=>$('#'+id).addEventListener('input',render));render();
</script></body></html>
