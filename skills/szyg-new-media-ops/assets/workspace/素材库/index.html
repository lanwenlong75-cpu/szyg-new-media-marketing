<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可复用素材</title><style>body{font:15px/1.8 system-ui;background:#f4f7f0;color:#233c2b;max-width:960px;margin:40px auto;padding:0 24px}article{background:white;border:1px solid #dde6d5;border-radius:12px;padding:20px;margin:15px 0}small{color:#7d8d72}a{color:#216342}</style><h1>可复用素材</h1><p>交给AI助手入库、检索和记录实际使用，原素材保留。</p><div id="list"></div><script src="catalog.js"></script><script>const assets=window.ASSET_LIBRARY?.assets||[];const box=document.querySelector('#list');if(!assets.length)box.textContent='素材库是空的。给助手图片、录屏、配乐或资料，就可以开始入库。';for(const a of assets){const card=document.createElement('article');for(const [tag,text] of [['h2',a.title],['p',a.purpose||'用途待补充'],['small',`${a.id} · ${a.category} · ${a.rights}`]]){let el=document.createElement(tag);el.textContent=text;card.append(el)}if(a.relativePath){const link=document.createElement('a');link.textContent='查看原文件';link.href=a.relativePath.split('/').map(encodeURIComponent).join('/');card.append(document.createElement('br'),link)}box.append(card)}</script></html>
